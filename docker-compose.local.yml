# Ajustes para correr en LOCALHOST (sin HTTPS ni Let's Encrypt).
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# Luego abrir http://localhost  (Swagger en http://localhost/api/docs).
# backend/.env debe usar las URLs de localhost (ver backend/.env.example).
services:
  backend:
    environment:
      HABILITAR_DOCS: "true"

  proxy:
    ports: !override
      - "80:80"
    volumes: !override
      - ./reverse/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
