# Cabeceras de seguridad (se incluyen en cada location porque add_header
# dentro de un location anula los del bloque server).
# CSP: solo scripts propios -> mitiga XSS, que es lo que podría robar el JWT
# guardado en localStorage. 'unsafe-inline' en estilos lo exige MUI (emotion).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
