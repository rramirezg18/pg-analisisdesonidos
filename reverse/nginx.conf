# Reverse proxy: punto de entrada único (HTTP 80 -> HTTPS 443).
#   /      -> contenedor frontend (React/Vite servido por nginx)
#   /api/  -> contenedor backend (FastAPI/uvicorn)

upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    server backend:8001;
}

# HTTP -> redirige todo a HTTPS
server {
    listen 80;
    server_name talleraguilasonidos.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name talleraguilasonidos.duckdns.org;

    # Certificado de Let's Encrypt (montado desde el host en docker-compose)
    ssl_certificate     /etc/letsencrypt/live/talleraguilasonidos.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talleraguilasonidos.duckdns.org/privkey.pem;

    # Tamaño máximo de subida
    client_max_body_size 25m;

    # API -> backend. La barra final en proxy_pass elimina el prefijo /api/.
    location /api/ {
        proxy_pass http://backend_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo demás -> frontend.
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
