# Reverse proxy: punto de entrada único en el puerto 80.
#   /      -> contenedor frontend (React/Vite servido por nginx)
#   /api/  -> contenedor backend (FastAPI/uvicorn)

upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;

    # Tamaño máximo de subida (ajusta si vas a enviar audios grandes).
    client_max_body_size 25m;

    # API -> backend. La barra final en proxy_pass elimina el prefijo /api/.
    location /api/ {
        proxy_pass http://backend_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo demás -> frontend.
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
