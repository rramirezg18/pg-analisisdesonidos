# nginx del frontend DENTRO de Kubernetes (montado desde un ConfigMap).
# Igual que frontend/nginx.conf + el proxy /api/ que en compose hace reverse/nginx.conf.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Traefik nos avisa el esquema original: si llegó por HTTP, redirigir a HTTPS.
    # (Las probes de K8s llegan directo al pod, sin este header, y no se redirigen.)
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Audios de hasta 25 MB.
    client_max_body_size 25m;

    # Probe de liveness/readiness del pod.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API -> Service "backend". La barra final en proxy_pass elimina el prefijo /api/.
    location /api/ {
        proxy_pass http://backend:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Traefik termina TLS: se respeta el esquema original que nos manda.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # El análisis con el CNN puede tardar unos segundos.
        proxy_read_timeout 120s;
    }

    # SPA: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
    }

    # Cache largo para assets con hash en el nombre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }
}
