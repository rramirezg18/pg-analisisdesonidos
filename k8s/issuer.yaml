# Emisor de certificados Let's Encrypt (cert-manager) dentro del namespace.
# HTTPS es obligatorio para grabar con el micrófono y para Google OAuth.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-cuenta
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
            # La cuota del namespace prohíbe NodePort (el tipo por defecto del solver).
            serviceType: ClusterIP
