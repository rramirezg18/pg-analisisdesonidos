# Frontend React servido por nginx. 2 réplicas + RollingUpdate sin downtime:
# si un pod muere o se actualiza la imagen, el otro sigue atendiendo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: motorscan-frontend
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: motorscan-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: motorscan-frontend
        app.kubernetes.io/component: web
    spec:
      # Repartir las réplicas en nodos distintos cuando se pueda.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: motorscan-frontend
      containers:
        - name: frontend
          image: motorscan-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            # Reemplaza solo el default.conf de la imagen por la versión de K8s
            # (agrega el proxy /api -> backend). La imagen sigue igual para compose.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-nginx
