# Autoescalado del backend: 2 a 3 réplicas (tope de la cuota) si el CPU promedio pasa del 70 %
# (la inferencia del CNN es lo que más CPU consume).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
