services:
  backend:
    build: ./backend
    container_name: pg_backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - ./backend/modelos:/app/modelos
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: pg_frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    container_name: pg_proxy
    ports:
      - "80:80"
    volumes:
      - ./reverse/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
